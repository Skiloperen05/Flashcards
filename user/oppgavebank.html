t:950;letter-spacing:.12em;text-transform:uppercase}.choice-card.exam .choice-label{color:#e8bc68}.choice-card.general .choice-label{color:#a9bdff}.choice-card h2{position:relative;margin:8px 0 0;color:#fff;font-size:24px;line-height:1.12;letter-spacing:-.03em}.choice-card p{position:relative;margin:9px 0 0;color:#c2cee4;font-size:14.5px;line-height:1.55}.choice-meta{position:relative;margin-top:18px;color:#cbd7ef;font-size:13px;font-weight:800}.choice-meta b{font-size:16px}.choice-cta{position:relative;margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:13px;font-size:14px;font-weight:950}.choice-card.exam .choice-cta{background:linear-gradient(135deg,#e8bc68,#f3c469);color:#2a1e06;box-shadow:0 16px 34px rgba(232,188,104,.28)}.choice-card.general .choice-cta{background:linear-gradient(135deg,#245cff,#4b7dff);color:#fff;box-shadow:0 16px 34px rgba(47,98,255,.30)}

rgba(232,188,104,.26);color:#ffd98f}.task-chevron{color:#6f83a8;font-size:22px}

d:rgba(255,255,255,.06);color:#dce6f7}.answer-box{display:none}.detail-card.show-answer .answer-box{display:block}

<script>
var state = readState();
var searchQuery = '';

function esc(value) {
  return String(value || '').replace(/[&<>"']/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
  });
}

function code(value) {
  return String(value || '').toUpperCase().replace(/[\s-]+/g, '');
}

function subjectKey(value) {
  var normalized = String(value || '').toLowerCase();
  return normalized === 'subj_sol1' ? 'sol1' : normalized;
}

function allTasks() {
  return window.HaugnesStudyData && typeof window.HaugnesStudyData.questions === 'function' ? window.HaugnesStudyData.questions() : [];
}

function catalogSubjects() {
  var meta = window.HaugnesSubjects;
  var base = [];
  if (meta && typeof meta.getCatalog === 'function') base = meta.getCatalog();
  else if (meta && typeof meta.getAllOriginal === 'function') base = meta.getAllOriginal();
  else if (meta && typeof meta.getAll === 'function') base = meta.getAll();

  var byCode = {};
  base.forEach(function (subject) { byCode[code(subject.code || subject.id)] = subject; });
  allTasks().forEach(function (task) {
    var c = code(task.subject);
    if (!c || byCode[c]) return;
    byCode[c] = {
      id: c.toLowerCase(),
      code: c,
      name: c,
      icon: c.slice(0, 1),
      accent: '#7c3aed',
      categoryOrder: 999,
      sortOrder: 999,
      description: 'Oppgaver lagt til uten egen fagmetadata ennå.'
    };
  });

  return Object.keys(byCode).map(function (key) { return byCode[key]; }).sort(function (a, b) {
    return (a.categoryOrder || 999) - (b.categoryOrder || 999)
      || (a.sortOrder || 999) - (b.sortOrder || 999)
      || String(a.code).localeCompare(String(b.code));
  });
}

function subjectByCode(subjectCode) {
  var wanted = code(subjectCode);
  return catalogSubjects().find(function (subject) { return code(subject.code || subject.id) === wanted; }) || null;
}

function tasksForSubject(subjectCode) {
  var wanted = code(subjectCode);
  return allTasks().filter(function (task) { return code(task.subject) === wanted; });
}

function splitTasks(subjectCode) {
  var rows = tasksForSubject(subjectCode);
  return {
    exam: rows.filter(function (task) { return !!task.exam; }),
    general: rows.filter(function (task) { return !task.exam; })
  };
}

function readState() {
  var params = new URLSearchParams(window.location.search);
  return {
    subject: code(params.get('subject')),
    type: params.get('type') === 'general' ? 'general' : params.get('type') === 'exam' ? 'exam' : '',
    task: params.get('task') || ''
  };
}

function setState(next, replace) {
  state = Object.assign({}, state, next || {});
  var params = new URLSearchParams();
  if (state.subject) params.set('subject', state.subject);
  if (state.type) params.set('type', state.type);
  if (state.task) params.set('task', state.task);
  var url = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
  window.history[replace ? 'replaceState' : 'pushState'](state, '', url);
  render();
}

function clearToOverview() {
  searchQuery = '';
  setState({ subject: '', type: '', task: '' });
}

function emblemHtml(subject) {
  var src = subject && subject.emblem;
  var fallback = esc((subject && (subject.icon || subject.code || subject.id) || '?').slice(0, 2));
  return '<span class="subject-emblem" style="background:' + esc(subject && subject.accent || '#2f62ff') + '">' + (src ? '<img src="' + esc(src) + '" alt="" onerror="this.remove()">' : fallback) + '</span>';
}

function difficultyClass(task) {
  return task && task.difficulty === 'Vanskelig' ? 'difficulty-pill hard' : 'difficulty-pill';
}

function subjectViewModel(subject) {
  var groups = splitTasks(subject.code);
  var total = groups.exam.length + groups.general.length;
  return { subject: subject, exam: groups.exam, general: groups.general, total: total };
}

function renderCrumbs() {
  var parts = ['<button type="button" data-route="overview">Oppgavebank</button>'];
  var subject = state.subject && subjectByCode(state.subject);
  if (subject) parts.push('<span>›</span><button type="button" data-route="subject">' + esc(subject.code) + '</button>');
  if (subject && state.type) parts.push('<span>›</span><button type="button" data-route="list">' + (state.type === 'exam' ? 'Eksamensoppgaver' : 'Generelle oppgaver') + '</button>');
  if (subject && state.task) parts.push('<span>›</span><strong>Oppgave</strong>');
  document.getElementById('crumbs').innerHTML = parts.join('');
  document.querySelectorAll('[data-route]').forEach(function (btn) {
    btn.onclick = function () {
      var route = btn.getAttribute('data-route');
      if (route === 'overview') clearToOverview();
      if (route === 'subject') setState({ type: '', task: '' });
      if (route === 'list') setState({ task: '' });
    };
  });
}

function renderOverview() {
  var subjects = catalogSubjects().map(subjectViewModel);
  var q = searchQuery.toLowerCase();
  var filtered = subjects.filter(function (row) {
    var subject = row.subject;
    var topicText = tasksForSubject(subject.code).map(function (task) { return task.topic + ' ' + task.title + ' ' + task.source; }).join(' ');
    var hay = [subject.code, subject.name, subject.description, topicText].join(' ').toLowerCase();
    return !q || hay.indexOf(q) !== -1;
  });
  return '<section>'
    + '<div class="overview-head"><div><div class="eyebrow">Oppgavebank</div><h1 class="overview-title">Velg et fag å øve på</h1><p class="overview-copy">Hvert fag i appen samles her, også fag som legges til senere i fagkatalogen. Åpne <strong>eksamensnære oppgaver</strong> eller <strong>generelle øvingsoppgaver</strong> direkte.</p></div>'
    + '<label class="big-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg><input id="overviewSearch" value="' + esc(searchQuery) + '" placeholder="Søk etter fag eller tema..."></label></div>'
    + (filtered.length ? '<div class="subject-bank-grid">' + filtered.map(renderSubjectCard).join('') + '</div>' : '<div class="empty-state"><strong>Ingen fag matcher søket.</strong>Prøv et annet søk, eller tøm feltet for å se alle fag.</div>')
    + '</section>';
}

function renderSubjectCard(row) {
  var subject = row.subject;
  return '<article class="subject-bank-card" style="--accent:' + esc(subject.accent || '#2f62ff') + '">'
    + '<button class="subject-main-btn" type="button" data-open-subject="' + esc(subject.code) + '"><div class="subject-card-top">' + emblemHtml(subject) + '<span class="subject-count">' + row.total + ' oppgaver</span></div><div class="subject-code-lg">' + esc(subject.code) + '</div><div class="subject-name-sm">' + esc(subject.name || '') + '</div></button>'
    + '<div class="subject-actions"><button class="subject-action exam" type="button" data-open-list="' + esc(subject.code) + '" data-type="exam"><span>Eksamensoppgaver</span><span><b>' + row.exam.length + '</b> →</span></button><button class="subject-action general" type="button" data-open-list="' + esc(subject.code) + '" data-type="general"><span>Generelle oppgaver</span><span><b>' + row.general.length + '</b> →</span></button></div>'
    + '<button class="subject-main-btn subject-open" type="button" data-open-subject="' + esc(subject.code) + '">Se fagoversikt <span>→</span></button></article>';
}

function renderSubjectChoice(subject) {
  var row = subjectViewModel(subject);
  return '<section><button class="back-btn" type="button" data-back="overview">← Alle fag</button>'
    + '<div class="subject-hero">' + emblemHtml(subject) + '<div><h1>' + esc(subject.code) + '</h1><p>' + esc(subject.name || '') + ' · <small>' + esc(subject.description || 'Oppgavebank for faget.') + '</small></p></div></div>'
    + '<p class="overview-copy">Velg hva du vil jobbe med i dette faget.</p>'
    + '<div class="choice-grid"><button class="choice-card exam" type="button" style="--glow:rgba(232,188,104,.22)" data-open-list="' + esc(subject.code) + '" data-type="exam"><span class="choice-icon"><svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5V8h4"/><path d="M9.5 12.5h5M9.5 16h3"/></svg></span><span class="choice-label">Eksamensrelevant</span><h2>Eksamensoppgaver</h2><p>Oppgaver som er merket som eksamensnære, sortert på tema, kilde og nivå.</p><span class="choice-meta"><b>' + row.exam.length + '</b> oppgaver</span><span class="choice-cta">Åpne eksamensoppgaver →</span></button>'
    + '<button class="choice-card general" type="button" data-open-list="' + esc(subject.code) + '" data-type="general"><span class="choice-icon"><svg viewBox="0 0 24 24"><path d="M13 3l-8 10h6l-1 8 8-10h-6z"/></svg></span><span class="choice-label">Øving · tema</span><h2>Generelle oppgaver</h2><p>Korte driller og temaoppgaver som passer til repetisjon og metodeøving.</p><span class="choice-meta"><b>' + row.general.length + '</b> oppgaver</span><span class="choice-cta">Åpne generelle oppgaver →</span></button></div></section>';
}

function renderTaskList(subject, type) {
  var groups = splitTasks(subject.code);
  var rows = groups[type] || [];
  var label = type === 'exam' ? 'Eksamensoppgaver' : 'Generelle oppgaver';
  return '<section><button class="back-btn" type="button" data-back="subject">← ' + esc(subject.code) + '</button><div class="list-head">' + emblemHtml(subject) + '<div><h1>' + esc(label) + '</h1><p>' + esc(subject.code) + ' · ' + esc(subject.name || '') + '</p></div></div>'
    + '<div class="segment"><button type="button" class="' + (type === 'exam' ? 'active' : '') + '" data-open-list="' + esc(subject.code) + '" data-type="exam">Eksamensoppgaver</button><button type="button" class="' + (type === 'general' ? 'active' : '') + '" data-open-list="' + esc(subject.code) + '" data-type="general">Generelle oppgaver</button></div>'
    + (rows.length ? '<div class="task-list">' + rows.map(function (task, index) { return renderTaskRow(task, index); }).join('') + '</div>' : '<div class="empty-state" style="margin-top:18px"><strong>Ingen oppgaver her ennå.</strong>Faget er med i oppgavebanken, og nye oppgaver vises automatisk når de legges i datakilden.</div>')
    + '</section>';
}

function renderTaskRow(task, index) {
  return '<button class="task-row" type="button" data-open-task="' + esc(task.id) + '"><span class="task-num">' + String(index + 1).padStart(2, '0') + '</span><span style="flex:1;min-width:0"><h2>' + esc(task.title) + '</h2><span class="task-row-meta"><b>' + esc(task.topic) + '</b><span>·</span><span>' + esc(task.source) + '</span><span>·</span><span>' + esc(task.minutes) + ' min</span></span></span><span class="' + difficultyClass(task) + '">' + esc(task.difficulty) + '</span><span class="task-chevron">›</span></button>';
}

function renderTaskDetail(subject, task) {
  var catLabel = task.exam ? 'Eksamensoppgaver' : 'Generelle oppgaver';
  return '<section class="task-detail"><button class="back-btn" type="button" data-back="list">← ' + esc(catLabel) + '</button><article class="detail-card" id="detailCard"><div class="detail-inner"><div class="detail-kicker">' + esc(subject.code) + ' · ' + esc(catLabel) + '</div><h1>' + esc(task.title) + '</h1><div class="detail-meta"><span>' + esc(task.topic) + '</span><span>≈ ' + esc(task.minutes) + ' min</span><span>' + esc(task.source) + '</span><span class="' + difficultyClass(task) + '">' + esc(task.difficulty) + '</span></div><div class="prompt-box"><b>Oppgavetekst</b><p>' + esc(task.prompt) + '</p></div><div class="checklist-box"><b>Sjekkliste</b><ul>' + (task.checklist || []).map(function (item) { return '<li>' + esc(item) + '</li>'; }).join('') + '</ul></div><div class="detail-actions"><button class="primary-action" type="button" id="startAnswer">Start besvarelse →</button><button class="ghost-action" type="button" id="toggleAnswer">Vis/skjul sjekkliste</button></div><div class="answer-box" id="answerBox"><b>Din besvarelse</b><textarea placeholder="Skriv løsningen din her..." style="width:100%;min-height:150px;resize:vertical;padding:16px;border-radius:16px;background:rgba(4,14,34,.5);border:1px solid rgba(126,162,255,.24);color:#f8fbff;font-family:inherit;font-size:15px;line-height:1.6;outline:none"></textarea></div></div></article></section>';
}

function render() {
  renderCrumbs();
  var root = document.getElementById('appRoot');
  var subject = state.subject && subjectByCode(state.subject);
  var task = state.task && allTasks().find(function (item) { return item.id === state.task; });
  var totalTasks = allTasks().length;
  var sideCount = document.getElementById('sideCount');
  if (sideCount) sideCount.innerHTML = totalTasks + ' <span>tilgjengelig</span>';

  if (!subject) root.innerHTML = renderOverview();
  else if (task) root.innerHTML = renderTaskDetail(subject, task);
  else if (state.type) root.innerHTML = renderTaskList(subject, state.type);
  else root.innerHTML = renderSubjectChoice(subject);

  bindUi();
}

function bindUi() {
  var search = document.getElementById('overviewSearch');
  if (search) {
    search.focus({ preventScroll: true });
    search.setSelectionRange(search.value.length, search.value.length);
    search.addEventListener('input', function () {
      searchQuery = search.value;
      render();
    });
  }
  document.querySelectorAll('[data-open-subject]').forEach(function (btn) {
    btn.onclick = function () { setState({ subject: code(btn.getAttribute('data-open-subject')), type: '', task: '' }); };
  });
  document.querySelectorAll('[data-open-list]').forEach(function (btn) {
    btn.onclick = function () { setState({ subject: code(btn.getAttribute('data-open-list')), type: btn.getAttribute('data-type'), task: '' }); };
  });
  document.querySelectorAll('[data-open-task]').forEach(function (btn) {
    btn.onclick = function () { setState({ task: btn.getAttribute('data-open-task') }); };
  });
  document.querySelectorAll('[data-back]').forEach(function (btn) {
    btn.onclick = function () {
      var target = btn.getAttribute('data-back');
      if (target === 'overview') clearToOverview();
      if (target === 'subject') setState({ type: '', task: '' });
      if (target === 'list') setState({ task: '' });
    };
  });
  var toggleAnswer = document.getElementById('toggleAnswer');
  if (toggleAnswer) toggleAnswer.onclick = function () { document.getElementById('detailCard').classList.toggle('show-answer'); };
  var startAnswer = document.getElementById('startAnswer');
  if (startAnswer) startAnswer.onclick = function () { document.getElementById('detailCard').classList.add('show-answer'); document.querySelector('#answerBox textarea').focus(); };
}

function nameFromEmail(email) {
  var name = (email || 'student').split('@')[0];
  return name.charAt(0).toUpperCase() + name.slice(1);
}

window.onUserAuthorized = function (session) {
  var name = nameFromEmail(session && session.user && session.user.email);
  var initial = name.charAt(0);
  ['sideName', 'topName'].forEach(function (id) { var el = document.getElementById(id); if (el) el.textContent = name; });
  ['sideAvatar', 'topAvatar'].forEach(function (id) { var el = document.getElementById(id); if (el) el.textContent = initial; });
};

window.addEventListener('popstate', function () { state = readState(); render(); });
render();
</script>
</body>
</html>
